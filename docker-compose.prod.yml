name: echo

services:
  echo-agent:
    build:
      context: ./agent
      target: runner
    container_name: echo_agent
    environment:
      - PORT=${AGENT_PORT:-3001}
      - REDIS_URL=${REDIS_URL:-redis://echo-redis:6379}
      - LLM_MODEL_API_URL=${LLM_MODEL_API_URL:-http://host.docker.internal:1234/v1}
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - STATE_BACKEND=${STATE_BACKEND:-backend}
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-change-this-to-a-secure-service-jwt-secret-min32chars}
      - BACKEND_URL=${BACKEND_URL:-http://echo-backend:8080}
    depends_on:
      - echo-redis
    restart: on-failure
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "sablier.enable=true"
      - "sablier.group=echo-app"
      - "sablier.timeout=1m"

  echo-backend:
    build:
      context: ./backend
      target: runner
    container_name: echo_backend
    environment:
      - PORT=${BACKEND_PORT:-8080}
      - AGENT_HTTP_URL=${AGENT_HTTP_URL:-http://echo-agent:3001}
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@echo-postgres:5432/echo_db?sslmode=disable}
      - DB_HOST=${DB_HOST:-echo-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-echo_db}
      - REDIS_ADDR=${REDIS_ADDR:-echo-redis:6379}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN:-default-internal-token-secret}
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-change-this-to-a-secure-service-jwt-secret-min32chars}
      - ENABLE_OTEL=${ENABLE_OTEL:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-opencode-go/deepseek-v4-flash}
    depends_on:
      - echo-postgres
      - echo-agent
    restart: on-failure
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "sablier.enable=true"
      - "sablier.group=echo-app"
      - "sablier.timeout=1m"

  echo-frontend:
    build:
      context: ./frontend/web
      target: runner
      args:
        - BACKEND_URL=${BACKEND_URL:-http://echo-backend:8080}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: echo_frontend
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - BACKEND_URL=${BACKEND_URL:-http://echo-backend:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - echo-backend
    restart: on-failure
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "sablier.enable=true"
      - "sablier.group=echo-app"
      - "sablier.timeout=1m"

networks:
  dokploy-network:
    external: true
