basePath: /
definitions:
  echo-backend_internal_models_auth.ApiKey:
    properties:
      created_at:
        example: "2026-01-15T10:30:00Z"
        type: string
      id:
        example: key_a1b2c3d4e5f6
        type: string
      name:
        example: Production API Key
        type: string
      prefix:
        example: sk_a1b2c3d4
        type: string
      scopes:
        example:
        - read
        - write
        - admin
        items:
          type: string
        type: array
      status:
        example: active
        type: string
      user_id:
        example: "1"
        type: string
    type: object
  echo-backend_internal_models_auth.User:
    properties:
      created_at:
        example: "2026-01-15T10:30:00Z"
        type: string
      email:
        example: jane@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Jane Doe
        type: string
      role:
        example: user
        type: string
      updated_at:
        example: "2026-01-15T10:30:00Z"
        type: string
    type: object
  echo-backend_internal_models_chat.Session:
    properties:
      context_summary:
        example: User is building a REST API for a todo app using Express and Prisma
        type: string
      created_at:
        example: "2026-01-15T10:30:00Z"
        type: string
      id:
        example: sess_abc123
        type: string
      last_accessed_at:
        example: "2026-01-15T11:45:00Z"
        type: string
      message_count:
        example: 12
        type: integer
      status:
        example: active
        type: string
      strategy_version:
        example: nlah:v1
        type: string
      title:
        example: Build a REST API with Express
        type: string
      token_count:
        example: 3421
        type: integer
      updated_at:
        example: "2026-01-15T11:45:00Z"
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  echo-backend_internal_models_llmops.PromptTemplate:
    properties:
      active_version:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  echo-backend_internal_models_llmops.PromptVersion:
    properties:
      bound_tools:
        items:
          type: string
        type: array
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      status:
        type: string
      system_prompt:
        type: string
      template_id:
        type: string
      variables:
        items:
          type: string
        type: array
      version:
        type: integer
    type: object
  echo-backend_internal_models_user.BudgetMonitorConfig:
    properties:
      enabled:
        type: boolean
      enforceCostCap:
        type: boolean
      enforceMaxSteps:
        type: boolean
      enforceTimeout:
        type: boolean
      maxCostUsd:
        type: number
      maxDurationMs:
        type: integer
      maxSteps:
        type: integer
    type: object
  echo-backend_internal_models_user.ContextOptimizationConfig:
    properties:
      compactionThresholdRatio:
        type: number
      enableAutoCompaction:
        type: boolean
      enablePrefixCachingLayout:
        type: boolean
      enabled:
        type: boolean
      keepLastTurnsCount:
        type: integer
    type: object
  echo-backend_internal_models_user.HarnessFeatureToggles:
    properties:
      budgetMonitor:
        $ref: '#/definitions/echo-backend_internal_models_user.BudgetMonitorConfig'
      contextOptimization:
        $ref: '#/definitions/echo-backend_internal_models_user.ContextOptimizationConfig'
      hitlGuard:
        $ref: '#/definitions/echo-backend_internal_models_user.HitlGuardConfig'
      loopDetection:
        $ref: '#/definitions/echo-backend_internal_models_user.LoopDetectionConfig'
      systemNotices:
        $ref: '#/definitions/echo-backend_internal_models_user.SystemNoticesConfig'
    type: object
  echo-backend_internal_models_user.HitlGuardConfig:
    properties:
      enabled:
        type: boolean
      protectedTools:
        items:
          type: string
        type: array
      ttlMinutes:
        type: integer
    type: object
  echo-backend_internal_models_user.LoopDetectionConfig:
    properties:
      enableCosineSimilarity:
        type: boolean
      enableExactMatch:
        type: boolean
      enabled:
        type: boolean
      maxConsecutiveIdenticalCalls:
        type: integer
      similarityThreshold:
        type: number
      windowSize:
        type: integer
    type: object
  echo-backend_internal_models_user.SystemNoticesConfig:
    properties:
      emitBudgetWarnings:
        type: boolean
      emitCompactionNotices:
        type: boolean
      emitLoopWarnings:
        type: boolean
      emitPacingWarnings:
        type: boolean
      enabled:
        type: boolean
    type: object
  echo-backend_internal_models_user.UserPreferences:
    properties:
      api_key:
        example: ""
        type: string
      base_url:
        example: https://opencode.ai/zen/go/v1
        type: string
      default_features:
        example:
        - web-browsing
        - code-interpreter
        items:
          type: string
        type: array
      default_mode:
        example: agent
        type: string
      default_model:
        example: gpt-4o
        type: string
      default_skills:
        example:
        - python
        - research
        items:
          type: string
        type: array
      harness_toggles:
        $ref: '#/definitions/echo-backend_internal_models_user.HarnessFeatureToggles'
      has_api_key:
        type: boolean
      provider_type:
        example: opencode-go
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  echo-backend_internal_service_features.FeatureResponse:
    properties:
      description:
        type: string
      id:
        type: string
      locked:
        type: boolean
      name:
        type: string
    type: object
  echo-backend_internal_service_llmops.PlaygroundRequest:
    properties:
      features:
        items:
          type: string
        type: array
      models:
        items:
          type: string
        type: array
      prompt:
        type: string
      skills:
        items:
          type: string
        type: array
      variables:
        additionalProperties:
          type: string
        type: object
    type: object
  internal_handler_admin.createAPIKeyRequest:
    properties:
      name:
        example: Production Key
        type: string
      scopes:
        example:
        - read
        - write
        items:
          type: string
        type: array
    type: object
  internal_handler_auth.loginRequest:
    properties:
      email:
        example: jane@example.com
        type: string
      password:
        example: P@ssw0rd!23
        type: string
    type: object
  internal_handler_auth.registerRequest:
    properties:
      email:
        example: jane@example.com
        type: string
      name:
        example: Jane Doe
        type: string
      password:
        example: P@ssw0rd!23
        type: string
    type: object
  internal_handler_chat.ChatRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      features:
        items:
          type: string
        type: array
      history:
        items:
          $ref: '#/definitions/internal_handler_chat.HistoryMessage'
        type: array
      message:
        type: string
      missionId:
        type: string
      mode:
        type: string
      model:
        type: string
      sessionId:
        type: string
      skills:
        items:
          type: string
        type: array
      strategyVersion:
        type: string
    type: object
  internal_handler_chat.HistoryMessage:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  internal_handler_llmops.createTemplateReq:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  internal_handler_llmops.createVersionReq:
    properties:
      bound_tools:
        items:
          type: string
        type: array
      system_prompt:
        type: string
      variables:
        items:
          type: string
        type: array
    type: object
  internal_handler_memory.episodicRecallRequest:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      session_id:
        type: string
    type: object
  internal_handler_memory.episodicStoreRequest:
    properties:
      content: {}
      metadata: {}
      session_id:
        type: string
      ttl_seconds:
        type: integer
    type: object
  internal_handler_memory.proceduralGetRequest:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_handler_memory.proceduralStoreRequest:
    properties:
      content:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
    type: object
  internal_handler_memory.semanticSearchRequest:
    properties:
      embedding:
        items:
          type: number
        type: array
      limit:
        type: integer
      query:
        type: string
      threshold:
        type: number
    type: object
  internal_handler_memory.semanticStoreRequest:
    properties:
      content:
        type: string
      embedding:
        items:
          type: number
        type: array
      id:
        type: string
      metadata:
        additionalProperties: true
        type: object
    type: object
  internal_handler_session.CreateSessionRequest:
    properties:
      strategyVersion:
        example: nlah:v1
        type: string
      title:
        example: Build a REST API with Express
        type: string
    type: object
  internal_handler_session.GenerateTitleRequest:
    properties:
      model:
        type: string
    type: object
  internal_handler_session.PruneRequest:
    properties:
      provider_config:
        additionalProperties: true
        type: object
    type: object
  internal_handler_settings.UpdateSettingsRequest:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      default_features:
        items:
          type: string
        type: array
      default_mode:
        type: string
      default_model:
        type: string
      default_skills:
        items:
          type: string
        type: array
      harness_toggles:
        $ref: '#/definitions/echo-backend_internal_models_user.HarnessFeatureToggles'
      keep_api_key:
        type: boolean
      provider_type:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@echo.app
    name: Echo API Support
    url: https://echo.app/support
  description: Core API Server for Echo Platform providing Auth, Chat, Sessions, Models,
    Settings, Admin, Memory, and System Services.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://echo.app/terms
  title: Echo Backend API
  version: "1.0"
paths:
  /api/v1/admin/api-keys:
    get:
      description: Returns all API keys (admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/echo-backend_internal_models_auth.ApiKey'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Generates and stores a new API key (admin)
      parameters:
      - description: API key payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_admin.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an API key
      tags:
      - Admin
  /api/v1/admin/api-keys/{id}:
    delete:
      description: Revokes an API key by ID (admin)
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an API key
      tags:
      - Admin
  /api/v1/admin/stats:
    get:
      description: Returns total and active API key counts (admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get API key statistics
      tags:
      - Admin
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Clears the authentication cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/echo-backend_internal_models_auth.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account and returns a JWT token
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
  /api/v1/chat:
    post:
      consumes:
      - application/json
      description: Forwards a user message to the agent for processing
      parameters:
      - description: Chat payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_chat.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send a chat message
      tags:
      - Chat
  /api/v1/features:
    get:
      description: Returns the catalog of agent features with tier-based locking
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/echo-backend_internal_service_features.FeatureResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List available agent features
      tags:
      - Chat
  /api/v1/internal/memory/episodic/recall:
    post:
      consumes:
      - application/json
      description: Recalls episodic memory entries for a session (internal)
      parameters:
      - description: Episodic recall payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_memory.episodicRecallRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Recall episodic memory
      tags:
      - Memory
  /api/v1/internal/memory/episodic/store:
    post:
      consumes:
      - application/json
      description: Stores an episodic memory entry for a session (internal)
      parameters:
      - description: Episodic memory payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_memory.episodicStoreRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Store episodic memory
      tags:
      - Memory
  /api/v1/internal/memory/procedural/get:
    post:
      consumes:
      - application/json
      description: Retrieves procedural memory entries by ID or name (internal)
      parameters:
      - description: Procedural recall payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_memory.proceduralGetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get procedural memory
      tags:
      - Memory
  /api/v1/internal/memory/procedural/store:
    post:
      consumes:
      - application/json
      description: Stores a procedural memory entry (internal)
      parameters:
      - description: Procedural memory payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_memory.proceduralStoreRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Store procedural memory
      tags:
      - Memory
  /api/v1/internal/memory/semantic/search:
    post:
      consumes:
      - application/json
      description: Searches semantic memory by query text (internal)
      parameters:
      - description: Semantic search payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_memory.semanticSearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search semantic memory
      tags:
      - Memory
  /api/v1/internal/memory/semantic/store:
    post:
      consumes:
      - application/json
      description: Stores a semantic memory entry with an optional embedding (internal)
      parameters:
      - description: Semantic memory payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_memory.semanticStoreRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Store semantic memory
      tags:
      - Memory
  /api/v1/internal/sessions/{id}/prune:
    post:
      consumes:
      - application/json
      description: Triggers token-threshold pruning and consolidation for a session
        (internal)
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Provider configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.PruneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Prune and consolidate a session
      tags:
      - Sessions
  /api/v1/missions/{id}/approve:
    post:
      description: Approves a human-in-the-loop tool approval request for a mission
      parameters:
      - description: Mission ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve a pending tool call
      tags:
      - Chat
  /api/v1/missions/{id}/deny:
    post:
      description: Denies a human-in-the-loop tool approval request for a mission
      parameters:
      - description: Mission ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deny a pending tool call
      tags:
      - Chat
  /api/v1/missions/{missionId}/stream:
    get:
      description: Streams real-time mission execution logs as Server-Sent Events
      parameters:
      - description: Mission ID
        in: path
        name: missionId
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Event stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Stream mission logs
      tags:
      - Chat
  /api/v1/models:
    get:
      description: Returns the AI model catalog available to the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List available AI models
      tags:
      - Models
  /api/v1/sessions:
    get:
      description: Returns all active sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
