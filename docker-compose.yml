name: echo

services:
  # --- DATABASES & INFRASTRUCTURE ---
  echo-postgres:
    image: pgvector/pgvector:pg16
    container_name: echo_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-echo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
      - ./backend/scripts/init-nuq.sql:/docker-entrypoint-initdb.d/init-nuq.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dokploy-network

  echo-redis:
    image: redis:7-alpine
    container_name: echo_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dokploy-network

  # --- AUTOMATED DATABASE MIGRATION & SEEDING ---
  echo-migrate:
    build:
      context: ./backend
      target: builder
    container_name: echo_backend_migrate
    command: ["./migrate"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@echo-postgres:5432/echo_db?sslmode=disable}
      - DB_HOST=${DB_HOST:-echo-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-echo_db}
    depends_on:
      echo-postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - dokploy-network

  echo-seed:
    build:
      context: ./backend
      target: builder
    container_name: echo_backend_seed
    command: ["./seed"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@echo-postgres:5432/echo_db?sslmode=disable}
      - DB_HOST=${DB_HOST:-echo-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-echo_db}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      - echo-migrate
    restart: on-failure
    networks:
      - dokploy-network

  # --- CORE APPLICATION SERVICES ---
  echo-agent:
    build:
      context: ./agent
    container_name: echo_agent
    environment:
      - PORT=${AGENT_PORT:-3001}
      - LLM_MODEL_API_URL=${LLM_MODEL_API_URL:-http://host.docker.internal:1234/v1}
      - STATE_BACKEND=${STATE_BACKEND:-backend}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN:-change-me-internal-token}
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-change-this-to-a-secure-service-jwt-secret-min32chars}
      - BACKEND_URL=${BACKEND_URL:-http://echo-backend:8080}
      - REDIS_URL=${REDIS_URL:-redis://echo-redis:6379}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-dummy}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-dummy}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://localhost:3000}
    depends_on:
      echo-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  echo-backend:
    build:
      context: ./backend
      target: runner
    container_name: echo_backend
    environment:
      - PORT=${BACKEND_PORT:-8080}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AGENT_HTTP_URL=${AGENT_HTTP_URL:-http://echo-agent:3001}
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@echo-postgres:5432/echo_db?sslmode=disable}
      - DB_HOST=${DB_HOST:-echo-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-echo_db}
      - REDIS_ADDR=${REDIS_ADDR:-echo-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-replace-this-with-a-secure-secret}
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-change-this-to-a-secure-service-jwt-secret-min32chars}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN:-change-me-internal-token}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-to-a-32-char-key!!!!}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-opencode-go/deepseek-v4-flash}
      - LOKI_URL=${LOKI_URL:-}
      - LOKI_USER=${LOKI_USER:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}
      - LOKI_TENANT_ID=${LOKI_TENANT_ID:-}
      - LOKI_LABELS=${LOKI_LABELS:-}
    depends_on:
      echo-postgres:
        condition: service_healthy
      echo-redis:
        condition: service_healthy
      echo-agent:
        condition: service_healthy
      echo-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  echo-frontend:
    build:
      context: ./app/web
      target: runner
      args:
        - BACKEND_URL=http://echo-backend:8080
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: echo_frontend
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - BACKEND_URL=http://echo-backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      echo-backend:
        condition: service_healthy
    restart: on-failure
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
